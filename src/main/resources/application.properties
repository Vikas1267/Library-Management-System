spring.application.name=library-management

# Default Database: H2 Embedded (Zero-configuration out-of-the-box experience for any machine)
spring.datasource.url=${DB_URL:jdbc:h2:mem:librarydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:}

# H2 Web Console Configuration (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format-sql=true

server.port=8080
jwt.secret=ThisIsASecretKeyForJWTGeneration123456
jwt.expiration=86400000

# AI Library Engine Configuration
ai.api.key=${AI_API_KEY:}
ai.model=gemini-1.5-flash
